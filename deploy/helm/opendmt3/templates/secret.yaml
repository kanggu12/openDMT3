{{- /* The first account's password, when the chart makes the account and the owner brings no Secret of their own. */}}
{{- if and .Values.admin.enabled (not .Values.admin.existingSecret) }}
{{- /* Refused at install rather than at the pod's start: the server would refuse an empty password there anyway. */}}
{{- if not .Values.admin.password }}
{{- fail "admin.enabled needs admin.password or admin.existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opendmt3.adminSecret" . }}
  labels:
    {{- include "opendmt3.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Read by the init container alone, as a variable of its own (never on a command line).
  password: {{ .Values.admin.password | quote }}
{{- end }}
