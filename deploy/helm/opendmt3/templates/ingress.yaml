{{- /* The site at a host name through the cluster's Ingress controller, with HTTPS when tls names a Secret. */}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "opendmt3.fullname" . }}
  labels:
    {{- include "opendmt3.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  # The owner's: cert-manager's issuer, the controller's body size for an uploaded song list.
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  # The certificates' Secrets, by host: cert-manager makes and renews them when an issuer is named.
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          # Every path is the site's: pages, API, updates and files alike.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "opendmt3.fullname" . }}-site
                port:
                  name: site
{{- end }}
