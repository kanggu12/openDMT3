# The openDMT3 server (game and site) with Docker Compose. ./dmt3 runs these for you (./dmt3 setup, up, down, ...);
# the plain commands, from the top of the clone (the published image of this version, pulled when it is not here):
#   docker compose up -d
# This clone's own image instead (packaging/docker/build.yaml builds it as opendmt3-server:local, never under the
# published name):
#   docker compose -f compose.yaml -f packaging/docker/build.yaml build
#   OPENDMT3_IMAGE=opendmt3-server:local docker compose up -d
# The first (owner's) account: in Docker the site sees visits from the container network, not from this PC, so the
# first-run page is never shown; make it here (the password is printed):
#   docker compose run --rm server --add-player BOSS --admin
# The song list (with its jackets and the DJ cards), imported once from your own game folder, an archive holding it,
# or a song list the launcher saved (mounted read-only):
#   docker compose run --rm -v /path/to/game:/game:ro server --catalog /game --setup-only
# (./dmt3 catalog PATH does the same, with the folders a game folder's links point into mounted too; the admin pages'
# Song list takes an uploaded song list.)
# The installer for the site's Download page, under the release's own name (of those there, the newest is handed out):
#   docker compose cp opendmt3-launcher-<version>-windows-x64-installer.exe server:/data/downloads/
# The project's name: its container (opendmt3-server-1), its network (opendmt3_default) and its data volume
# (opendmt3_data) carry it.
# .env beside this file (./dmt3 writes it, a comment above each line): GAME_PORT, WEB_PORT and ADMIN_PORT (the ports on
# this PC), ADMIN_BIND (127.0.0.1: the admin pages on this PC alone; 0.0.0.0: other PCs on the network too),
# SITE_ADDRESS (the players' address), GAME_DIR and GAME_LINKS (the client data kept mounted), OPENDMT3_IMAGE (the
# image), and while the site is exposed EDGE_NAME, EDGE_ADMIN, HTTP_PORT and HTTPS_PORT (packaging/docker/edge.yaml).
name: opendmt3
services:
  server:
    # The image: the published one of this version (amd64 and arm64), or this clone's own after ./dmt3 up --build,
    # which builds it as opendmt3-server:local and keeps OPENDMT3_IMAGE in .env. ./dmt3 always names it; the default
    # here is for docker compose run by hand, and moves with each release (tests/test_front_door.py checks it).
    # No recipe here: with the image missing, every command pulls it, and none builds this clone under the published
    # name (packaging/docker/build.yaml is the recipe, read only to build).
    image: ${OPENDMT3_IMAGE:-ghcr.io/kanggu12/opendmt3-server:0.4.1}
    restart: unless-stopped
    ports:
      # The game's port, for cabinets on other PCs.
      - "${GAME_PORT:-4725}:${GAME_PORT:-4725}"
      # The players' site and the launcher's API, on one port, for the other PCs too. Over the internet, ./dmt3 expose
      # puts Caddy in front of it instead (packaging/docker/edge.yaml, docs/internet.md).
      - "${WEB_PORT:-4730}:${WEB_PORT:-4730}"
      # The admin pages, a site of their own (docs/admin.md): on this PC alone (127.0.0.1), unless the owner opens them
      # to the network (ADMIN_BIND=0.0.0.0 in .env, ./dmt3 setup --admin-network yes); ADMIN_PORT is their port
      # (./dmt3 ports --admin), the same number inside, as the game's and the site's are.
      - "${ADMIN_BIND:-127.0.0.1}:${ADMIN_PORT:-4731}:${ADMIN_PORT:-4731}"
    environment:
      # Who runs the server, for the admin's Server tab (web/runner.py): Docker Compose, whose commands (./dmt3 down,
      # restart, remove) it names, since Compose starts the server again whenever its process ends.
      OPENDMT3_RUNNER: docker
      # The two ports, the same inside and out (./dmt3 ports keeps others in .env as GAME_PORT and WEB_PORT): the server
      # listens on them, and the site tells launchers the game's port they reach.
      OPENDMT3_GAME_PORT: ${GAME_PORT:-4725}
      OPENDMT3_WEB_PORT: ${WEB_PORT:-4730}
      # The admin listener on its port, on every address of the container, so the port published above reaches it:
      # which addresses of this PC reach it is the published side's (ADMIN_BIND).
      OPENDMT3_ADMIN_PORT: ${ADMIN_PORT:-4731}
      OPENDMT3_ADMIN_HOST: "0.0.0.0"
      # That published side, which the server cannot see from inside: who reaches the admin port on this PC (127.0.0.1,
      # this PC alone; 0.0.0.0, the network too) and its number there, for the players' site's way to the admin pages.
      OPENDMT3_ADMIN_HOST_BIND: ${ADMIN_BIND:-127.0.0.1}
      OPENDMT3_ADMIN_HOST_PORT: ${ADMIN_PORT:-4731}
      # The game folder mounted below, which the admin's Song list tab imports again (none: not offered).
      OPENDMT3_GAME: ${GAME_DIR:-}
      # The site's address as the players reach it (./dmt3 setup keeps the one chosen there in .env): the message to
      # send a player carries it (none: the address the admin's browser used).
      OPENDMT3_SITE_ADDRESS: ${SITE_ADDRESS:-}
    volumes:
      # A named volume: it starts out owned by the image's own user, who keeps the database in it.
      - data:/data
      # Optional: your game folder, read-only, at its own path inside the container, and the folder its links point
      # into. Set GAME_DIR (and GAME_LINKS) in .env beside this file; ./dmt3 setup writes them when the server's own
      # user can read the folder. Without them a folder of this repository stands in, which the server never reads.
      - type: bind
        source: ${GAME_DIR:-./packaging/docker}
        target: ${GAME_DIR:-/opt/no-game}
        read_only: true
      - type: bind
        source: ${GAME_LINKS:-./packaging/docker}
        target: ${GAME_LINKS:-/opt/no-game-links}
        read_only: true

volumes:
  data:
