name: Something does not work
description: The launcher, the game it starts, a server, its site or the admin pages do something wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. English or Korean are both fine. Please attach no game files (the client, songs,
        charts, images) and no links to them.
        A security problem goes to the Security tab instead (SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Where it happened
      options:
        - The launcher on Windows (openDMT3-win-Setup.exe)
        - The game, started by the launcher
        - A server with Docker (./dmt3 setup)
        - A server with Docker Compose itself
        - A server with Python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: openDMT3 version
      description: The launcher's **Launcher** page says it, and a server's site says it at the foot of every page.
      placeholder: 0.1.0
  - type: input
    id: windows
    attributes:
      label: Windows version, screen and scaling
      description: Only when the launcher or the game is involved.
      placeholder: Windows 11 24H2, 3840x2160 at 150 %
  - type: textarea
    id: checks
    attributes:
      label: What the checks say
      description: >-
        The launcher: openDMT3-cmd.exe --check in a terminal opened in %LocalAppData%\openDMT3\current, or Help,
        Report, Save (attach the zip; it holds no game files). A server with Docker: ./dmt3 status, ./dmt3 doctor
        and ./dmt3 check.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        The lines around the problem: the launcher's %AppData%\openDMT3\logs\launcher.log, or ./dmt3 logs for a
        server. Remove addresses and names you do not want to share.
      render: text
  - type: checkboxes
    id: files
    attributes:
      label: Game files
      options:
        - label: This report holds none of the game's files and no links to them.
          required: true
