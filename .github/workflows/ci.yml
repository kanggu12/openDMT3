# What a change has to pass, with no game files and no screen: on every push to main and every pull request, and on a
# release's tag first (release.yml). A maintainer runs each job on a Linux PC the same way before it goes in
# (docs/testing.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A tag runs this whole workflow on its commit first (release.yml).
  workflow_call:

permissions:
  contents: read

# A newer push to a branch or a pull request makes the run of the one before it moot: that run is cancelled. A tag's
# run (release.yml calls this workflow) has a group of its own, so it is never cancelled nor held back by another.
concurrency:
  group: ci-${{ startsWith(github.ref, 'refs/tags/') && github.run_id || github.ref }}
  cancel-in-progress: true

# Every run block in bash with -o pipefail beside -e (GitHub's own `bash` shell; without it a step is `bash -e` alone):
# a command failing inside a pipe fails its step, as in the maintainer's run of the jobs on a Linux PC. The windows
# job keeps PowerShell.
defaults:
  run:
    shell: bash

# Every action from elsewhere is pinned by its commit, its release in a comment: a tag moved later never runs here
# (tests/test_release_notes.py checks each). No job pushes anything: each checkout leaves no token in the clone's git
# settings for the steps after it.

jobs:
  # The unit tests on the oldest Python a server runs on and on the one the server's image and the launcher run, with
  # the site's libraries at the versions those pin; the parts' boundary on its own, so a broken boundary shows as its
  # own step; pyflakes over the package, the tests, the front door and the scripts that build and release it.
  test:
    runs-on: ubuntu-24.04
    # A stalled download fails after 15 minutes, not GitHub's six hours: several times what this job takes.
    timeout-minutes: 15
    strategy:
      # Each Python's result is seen, whichever fails first.
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: The site's libraries, the test client and the linter
        run: >-
          python -m pip install starlette==0.47.3 jinja2==3.1.6 uvicorn==0.35.0 python-multipart==0.0.20
          httpx==0.28.1 pillow==11.3.0 pyflakes==3.2.0

      # The official 7-Zip, the release the server's image and the launcher bring, by the same address and hash as
      # packaging/windows/sevenzip.sh: the tests of archives run with it, whatever 7-Zip the runner has or lacks.
      - name: The official 7-Zip for the tests of archives
        run: |
          curl -fsSL -o "$RUNNER_TEMP/7z.tar.xz" https://www.7-zip.org/a/7z2501-linux-x64.tar.xz
          echo "4ca3b7c6f2f67866b92622818b58233dc70367be2f36b498eb0bdeaaa44b53f4  $RUNNER_TEMP/7z.tar.xz" | sha256sum -c --quiet
          tar -xJf "$RUNNER_TEMP/7z.tar.xz" -C "$RUNNER_TEMP" 7zz
          echo "OPENDMT3_7ZIP=$RUNNER_TEMP/7zz" >> "$GITHUB_ENV"

      # On the runner's cores at once, as ./dmt3 test runs them (tests/parallel.py), a line for each class.
      - name: Unit tests
        run: python -m tests.parallel -v

      - name: The boundary test
        run: python -m unittest tests.test_architecture -v

      # Everything pyflakes says, its standard error too (a file that does not parse is said there, and so is a
      # pyflakes that cannot run): the one known line (updates.py imports velopack only to see whether it is there) is
      # let through; any other fails the step.
      - name: pyflakes
        run: |
          python -m pyflakes opendmt3 tests dmt3 packaging .github > lint.txt 2>&1 || true
          cat lint.txt
          extra=$(grep -v "'velopack' imported but unused" lint.txt || true)
          test -z "$extra"

  # openDMT3's card reader library (native/cardreader), built for the game's 32 bits with MinGW-w64, with its touch
  # screen library and their notices, and its native tests under Wine, both in containers with no network (build.sh,
  # test.sh); then the official 7-Zip for Windows taken out of its release as the launcher's build takes it
  # (packaging/windows/sevenzip.sh), and DSOAL and OpenAL Soft built from their pinned sources (native/openal/build.sh).
  # The libraries, their notices, 7-Zip and the two OpenAL libraries go to the windows job, which builds the launcher
  # with them.
  native:
    runs-on: ubuntu-24.04
    # The Wine image takes most of it (WineHQ's packages): several times that is a stalled job.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: The card reader library and its notices
        run: native/cardreader/build.sh "$PWD/_work/windows-parts"

      - name: Its native tests under Wine
        run: native/cardreader/test.sh

      - name: The official 7-Zip for Windows
        run: packaging/windows/sevenzip.sh "$PWD/_work/windows-parts"

      # Four compilers at a time, the runner's four cores, which this job has to itself (the release machine's build
      # keeps to two, beside the rest of its work).
      - name: The Sound page's OpenAL Soft mixer (DSOAL and OpenAL Soft) and its notices
        env:
          OPENDMT3_BUILD_JOBS: 4
        run: native/openal/build.sh "$PWD/_work/windows-parts/openal"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-parts
          path: |
            _work/windows-parts/CRT_R1.dll
            _work/windows-parts/multiDLL.dll
            _work/windows-parts/card-reader-NOTICES.txt
            _work/windows-parts/7zip/
            _work/windows-parts/openal/dsoal-aldrv.dll
            _work/windows-parts/openal/openDMT3-dsoal.dll
            _work/windows-parts/openal/openal-NOTICES.txt
          retention-days: 14

  # The launcher's screens on a virtual screen in a container with no network: the first-start guide, every page, the
  # dialogs, the installer's states and the keyboard focus, in English and Korean at 1180x760, 960x640 and 1600x1000,
  # each measured for text cut off, a label never told its width, a squeezed button or anything past the window's edge
  # (tests/e2e/ui/run.sh). Every size must end with 0 problems. A job for each language, both at once: each runs its
  # three sizes one after another on a runner of its own, as one job ran all six.
  ui:
    runs-on: ubuntu-24.04
    # Building the test machine and three sizes of screens, each with 15 minutes of its own in run.sh: several times
    # what this job takes is a stalled job.
    timeout-minutes: 45
    strategy:
      # Each language's result is seen, whichever fails first.
      fail-fast: false
      matrix:
        lang: [en, ko]
    env:
      UI_LANG: ${{ matrix.lang }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Every screen, with the layout check
        run: |
          tests/e2e/ui/run.sh "$PWD/_work/ui" "$UI_LANG" | tee ui.txt
          # The language at each of its three sizes said its screens (some, never none) and 0 problems: three lines.
          test "$(grep -cE "^$UI_LANG-[0-9]+x[0-9]+: [1-9][0-9]* screens, 0 problems\$" ui.txt)" = 3

      # What the screens looked like, for looking through: also when it passed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-screens-${{ matrix.lang }}
          path: _work/ui
          retention-days: 14

  # The site's pages in headless Chrome against the server's image on made-up data, both in containers on a network of
  # their own: every page in English and Korean at a desktop and a phone width, the questions asked first, the upload
  # fields by mouse, keyboard and screen reader, both uploads, the songs filter, a token shown once and maintenance off
  # and on (tests/e2e/web/run.sh). A job for each of its two servers, both at once: the one with made-up data, and the
  # empty one (OPENDMT3_WEB_PART), each judged whole on a runner of its own, as one job ran them one after the other.
  web:
    runs-on: ubuntu-24.04
    # The server's image and Chrome's: several times what this job takes is a stalled job.
    timeout-minutes: 30
    strategy:
      # Each server's result is seen, whichever fails first.
      fail-fast: false
      matrix:
        part: [full, empty]
    env:
      OPENDMT3_WEB_PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Every page, with the layout check
        run: tests/e2e/web/run.sh "$PWD/_work/web"

      # What the browser saw, for looking through: also when it passed. The made-up servers' data folders stay out:
      # their database and backups are their own user's alone (0600), which the runner's user cannot read.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: web-pages-${{ matrix.part }}
          path: |
            _work/web
            !_work/web/data
            !_work/web/empty-data
          retention-days: 14

  # The server's image as packaging/docker/Dockerfile builds it: every part's license text in it, then started as
  # compose starts it, answering /health, running as its own user, and stopped.
  server:
    runs-on: ubuntu-24.04
    # A stalled download fails after 15 minutes, not GitHub's six hours: several times what this job takes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: The server's image
        run: docker build -f packaging/docker/Dockerfile -t opendmt3-server:ci .

      - name: Every part's license text in the image
        run: >-
          docker run --rm --network none -v "$PWD/packaging/docker:/check:ro" --entrypoint python opendmt3-server:ci
          -I /check/check_licences.py

      - name: Started, answering /health, as its own user
        run: |
          # Stopped however the step ends, a failed check's too (a run on a PC again finds the name free).
          trap 'docker rm -f odt3-ci-server >/dev/null 2>&1' EXIT
          docker run -d --name odt3-ci-server -p 127.0.0.1:14730:4730 opendmt3-server:ci >/dev/null
          # Up when /health answers (the server makes its database first).
          code=000
          for _ in $(seq 1 60); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:14730/health || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          docker logs odt3-ci-server > /tmp/server.log 2>&1
          cat /tmp/server.log /tmp/health.json
          test "$code" = 200
          # The version this tree carries, in the answer and on the site's pages.
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' opendmt3/__init__.py)
          grep -q "\"version\":\"$version\"" /tmp/health.json
          # The page kept whole first: grep -q stops at its first match, and with pipefail a curl still writing to it
          # would fail the step for a page that is right.
          curl -sf -o /tmp/licenses.html http://127.0.0.1:14730/licenses
          grep -q "openDMT3 $version" /tmp/licenses.html
          # Its own user (packaging/docker/Dockerfile), not root.
          test "$(docker exec odt3-ci-server id -u)" = 4725
          docker rm -f odt3-ci-server >/dev/null

      # The Helm chart linted and rendered by Helm's own image, at the release's Helm, as the release packages it.
      - name: The Helm chart
        run: |
          docker run --rm --network none -v "$PWD/deploy/helm:/charts:ro" alpine/helm:3.16.4 lint /charts/opendmt3
          docker run --rm --network none -v "$PWD/deploy/helm:/charts:ro" alpine/helm:3.16.4 template t /charts/opendmt3 \
            --set ingress.enabled=true --set ingress.host=dmt3.example.org > /dev/null

      # ./dmt3 expose on a copy of the tree with ports of its own: Caddy's local authority, then Pebble as an ACME
      # authority, then --off (tests/e2e/expose/run.sh), with the image built above.
      - name: The site over HTTPS with ./dmt3 expose
        run: tests/e2e/expose/run.sh "$RUNNER_TEMP/expose" opendmt3-server:ci

  # The server's packages for Linux and macOS (packaging/server/bundle.sh): each put together on this Linux runner from
  # its pinned files alone (python-build-standalone's Python, the site's libraries' wheels, the official 7-Zip) in a
  # container with no network, twice, into two folders: the same bytes both times. They bring no launcher's installer
  # here (the release machine builds it and puts it in each); the package job runs each on its own system.
  packages:
    runs-on: ubuntu-24.04
    # The pinned files, some 150 MB, then four packages twice: several times what this job takes is a stalled job.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: The four packages, twice, the same bytes
        env:
          # One cache of the pinned files for both builds: the second fetches nothing.
          OPENDMT3_BUNDLE_CACHE: ${{ runner.temp }}/package-cache
        run: |
          packaging/server/bundle.sh "$RUNNER_TEMP/packages"
          packaging/server/bundle.sh "$RUNNER_TEMP/again"
          cat "$RUNNER_TEMP/packages/packages.sha256"
          # Four packages, each the same bytes from the second folder.
          test "$(wc -l < "$RUNNER_TEMP/packages/packages.sha256")" = 4
          diff "$RUNNER_TEMP/packages/packages.sha256" "$RUNNER_TEMP/again/packages.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-packages
          path: ${{ runner.temp }}/packages/opendmt3-server-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Each package on its own system and processor, with nothing of the runner's (tests/e2e/package/check.sh): unpacked,
  # its version, the owner's account, started, /health and the admin pages', its 7-Zip, repair, stopped; then the
  # one-line install from a folder of its files, again while it runs, and --uninstall. Linux's in a bare Debian 10
  # (glibc 2.28, no Python, no curl), on an x64 runner and an arm64 one; macOS's on an Intel Mac and on Apple silicon.
  package:
    needs: packages
    strategy:
      # Each system's result is seen, whichever fails first.
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-x64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    # A start and an install take seconds: several times what this job takes is a stalled job.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-packages
          path: packages

      - name: Unpacked and run, then the one-line install from a folder of its files
        env:
          TARGET: ${{ matrix.target }}
        run: |
          archive=$(ls packages/opendmt3-server-*-"$TARGET".tar.gz)
          if [ "$RUNNER_OS" = Linux ]; then
            docker run --rm --network none -v "$PWD:/w:ro" -w /w \
              debian:buster-slim@sha256:bb3dc79fddbca7e8903248ab916bb775c96ec61014b3d02b4f06043b604726dc \
              sh tests/e2e/package/check.sh "$archive"
          else
            sh tests/e2e/package/check.sh "$archive"
          fi

  # The launcher on Windows itself: the unit tests of what runs on a player's PC (the game folder and its setup, the
  # launcher, the server it runs for playing on that PC, the licenses gathered for it) on Windows' own paths, files and
  # processes; then the launcher built with PyInstaller as a release builds it, with the card reader library and 7-Zip
  # from the native job, its licenses gathered, and started: --version, and --inspect on a made-up folder
  # (tests/e2e/windows/built_launcher.py). No game files anywhere, and nothing opens a window.
  windows:
    needs: native
    runs-on: windows-latest
    # PyInstaller and the unit tests: several times what this job takes is a stalled job.
    timeout-minutes: 30
    # Windows' own shell, as the runner gives it (the workflow's bash is for the Linux jobs).
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-parts
          path: windows-parts

      # The launcher's build machine's versions (packaging/windows/Dockerfile), and the test client.
      - name: The launcher's libraries, PyInstaller and the test client
        run: >-
          python -m pip install pyinstaller==6.16.0 pillow==11.3.0 velopack==1.2.161 starlette==0.47.3 jinja2==3.1.6
          uvicorn==0.35.0 python-multipart==0.0.20 httpx==0.28.1

      # tests/core, tests/client and tests/server with the build scripts' tests, those that stay on Linux named with why
      # (tests/e2e/windows/unit_tests.py).
      - name: Unit tests on Windows
        env:
          # The official 7-Zip for Windows the launcher brings, from the native job: the tests of archives run with it.
          OPENDMT3_7ZIP: ${{ github.workspace }}\windows-parts\7zip\7z.exe
        run: python tests/e2e/windows/unit_tests.py

      - name: The launcher built and started
        run: python tests/e2e/windows/built_launcher.py windows-parts _work/windows-ci

      # The server's one-line install for Windows (packaging/server/install.ps1) in Windows PowerShell 5.1, as irm | iex
      # runs it, from a folder holding this tree's Windows server package (frozen here by server.spec): for the
      # runner's user with no administrator's rights, by name in the same window and in a new PowerShell, the first
      # install started with the owner's first-run page asked of a recorder in the browser's place, installed again
      # while it runs, a later release's zip that is not the release's refused, and removed with the data kept
      # (tests/e2e/windows/server_install.py, which runs on a CI runner alone).
      - name: The server's one-line install for Windows
        run: python tests/e2e/windows/server_install.py windows-parts _work/windows-server
