<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 1008 310" width="1008" height="310" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'Malgun Gothic', Helvetica, Arial, sans-serif" role="img" aria-label="Frames on time and on the music: the game's own frame limiter against openDMT3's clock, locked to the music. The spread of a frame's length (standard deviation): 2.33 milliseconds against 0.00. The slowest frame in a hundred: 20.6 milliseconds against 16.8, where a frame at 60 a second is 16.7. Measured on an RTX 4090 at 1920x1080 on the game's title screen. Over a whole song of 123 seconds on Wine's software renderer, the music ended 1.2 seconds ahead of the frames with the game's own pacing, and within 7 milliseconds of them locked to the music.">
<rect x="-24" y="-24" width="1008" height="310" fill="#f3f5f8"/>
<text x="0" y="18" font-size="19" font-weight="700" fill="#0b0e12" text-anchor="start" data-box="0,960">Frames on time, and on the music</text>
<text x="0" y="42" font-size="13" fill="#47515d" text-anchor="start" data-box="0,960">The game's own frame limiter against openDMT3's clock, locked to the song's music (the default).</text>
<text x="0" y="82" font-size="13.5" font-weight="600" fill="#0b0e12" text-anchor="start" data-box="0,288">Spread of a frame's length</text>
<text x="0" y="101" font-size="12" fill="#47515d" text-anchor="start" data-box="0,288">standard deviation: lower is steadier</text>
<path d="M0.0,122.0 H193.6 Q197.6,122.0 197.6,126.0 V138.0 Q197.6,142.0 193.6,142.0 H0.0 Z" fill="#7a8592"/>
