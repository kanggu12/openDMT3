# The site over HTTPS at a name: Caddy in front of it, with the certificate it gets and renews by itself. ./dmt3 expose
# writes .edge/Caddyfile and keeps EDGE_NAME in .env; every ./dmt3 command then reads this file after compose.yaml.
# By hand, from the top of the clone:
#   docker compose -f compose.yaml -f packaging/docker/edge.yaml up -d
# Caddy shares the server's network (network_mode), so it reaches the site at 127.0.0.1 on its port, where the site alone
# listens now, and the server believes the forwarded headers of that one address (--proxy 127.0.0.1): visitors are told
# apart, and HTTPS sign-ins get secure cookies. The game's port stays as it is: the game speaks its own protocol.
services:
  server:
    # The image's entry point gives --data /data --host 0.0.0.0; these follow it.
    command: ["--web-host", "127.0.0.1", "--proxy", "127.0.0.1"]
    # In place of compose.yaml's ports (the site's own port is no longer reached from outside): the game's, then
    # Caddy's, which shares this container's network, then the admin pages' own. 80 takes plain HTTP (sent on to HTTPS) and the authority's
    # challenge; 443 is HTTPS, over TCP and, for HTTP/3, UDP.
    ports: !override
      - "${GAME_PORT:-4725}:${GAME_PORT:-4725}"
      # Another PC port for each when 80 and 443 are another program's (./dmt3 ports --http/--https).
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
      # The admin pages stay where they were, on this PC (or the network as ADMIN_BIND says): only expose
      # --admin-public (edge-admin.yaml) puts them behind Caddy.
      - "${ADMIN_BIND:-127.0.0.1}:${ADMIN_PORT:-4731}:${ADMIN_PORT:-4731}"
  edge:
    # An exact release of Caddy's own image, so every server runs the proxy that was tried.
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    # The server's network, and the server first.
    network_mode: "service:server"
    depends_on: [server]
    volumes:
      # The Caddyfile ./dmt3 expose wrote, and the root of a private ACME authority when one was named (--ca-root).
      - ./.edge:/etc/caddy:ro
      # The certificates and Caddy's local authority, kept across restarts and updates (an authority limits how often
      # it signs for one name).
      - edge-data:/data
      - edge-config:/config

volumes:
  edge-data:
  edge-config:
